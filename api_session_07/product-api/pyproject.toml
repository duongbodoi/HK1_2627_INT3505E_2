[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "marshmallow>=3.20",
  "gunicorn",
]

[tool.setuptools.packages.find]
where = ["src"]