openapi: 3.0.3
info:
  title: Users API
  version: "2.0.0"
  description: |
    URI Path versioning. v1 và v2 là hai URI tree độc lập.
    **v1 đã deprecated** — sẽ trả về header `Sunset` (RFC 8594) và tắt vào 2026-12-31.
servers:
  - url: http://localhost:5000
paths:
  /api/v1/users/{id}:
    get:
      tags: [v1]
      deprecated: true
      summary: Lấy user (v1, deprecated)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          headers:
            Sunset:
              description: Ngày v1 ngừng hoạt động (HTTP-date)
              schema: { type: string, example: "Thu, 31 Dec 2026 23:59:59 GMT" }
            Deprecation:
              schema: { type: string, example: "true" }
            Link:
              description: Trỏ tới successor version
              schema: { type: string, example: '</api/v2/users>; rel="successor-version"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserV1" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/users/{id}:
    get:
      tags: [v2]
      summary: Lấy user (v2)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserV2" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/users:
    post:
      tags: [v2]
      summary: Tạo user (chỉ có ở v2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema: { type: string, example: /api/v2/users/3 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserV2" }
        "422":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    NotFound:
      description: Không tìm thấy user
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: nf }
  schemas:
    UserV1:
      type: object
      required: [id, full_name, email]
      properties:
        id: { type: integer }
        full_name: { type: string, example: "Văn Nguyễn" }
        email: { type: string, format: email }
    UserV2:
      type: object
      required: [id, first_name, last_name, email]
      properties:
        id: { type: integer }
        first_name: { type: string, example: "Văn" }
        last_name: { type: string, example: "Nguyễn" }
        email: { type: string, format: email }
    UserCreate:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: validation_failed }
        missing_or_invalid:
          type: array
          items: { type: string }
